<!DOCTYPE html>
<html>
<head>
    <title>Login - Attendance System</title>
    {% set logo_cache_bust = '1.0' %}
    <link rel="preload" href="{{ url_for('static', filename='amity-university-logo.png') }}?_={{ logo_cache_bust }}" as="image">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary-navy: #002D62;
            --accent-yellow: #FFC300;
            --card-bg: #ffffff;
            --muted-bg: #e0e0e0;
            --text-dark: #333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        body{ 
            background: var(--muted-bg); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        .card {
            background: var(--card-bg);
            border: none;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .card-body {
            padding: 40px;
        }

        h2 {
            color: var(--primary-navy);
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .btn-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .user-type-btn {
            border-color: var(--primary-navy);
            color: var(--primary-navy);
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 20px;
            flex: 1;
            text-align: center;
        }
        
        .user-type-btn:hover {
            background-color: var(--primary-navy);
            border-color: var(--primary-navy);
            color: white;
        }
        
        .user-type-btn.active {
            background-color: var(--accent-yellow);
            border-color: var(--accent-yellow);
            color: var(--primary-navy);
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-navy);
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 0.2rem rgba(0, 45, 98, 0.25);
        }

        .btn-primary {
            background: var(--accent-yellow);
            color: var(--primary-navy);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: #e6b300;
            color: var(--primary-navy);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .text-muted {
            color: #666 !important;
        }

        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            border-radius: 8px;
        }

        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            border-radius: 8px;
        }

        /* Container adjustments */
        .login-container {
            margin-top: 0px;
        }

        /* Logo styling if needed */
        .system-logo {
            color: var(--accent-yellow);
            margin-right: 10px;
        }
        /* Header bar styling */
        .header-bar {
            background: var(--primary-navy);
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }
        
        .header-bar .container {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        
        .header-bar .amity-logo {
            height: 44px;
            width: auto;
            margin-right: 18px;
            display: block;
        }
        
        .header-bar .nav-divider {
            width: 2px;
            height: 38px;
            background: var(--accent-yellow);
            margin: 0 18px;
            border-radius: 2px;
            display: block;
        }
        
        .header-bar .nav-title {
            color: white;
            margin: 0;
            font-weight: 700;
            font-size: 28px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Header Bar -->
    <div class="header-bar">
        <div class="container">
            <div class="d-flex align-items-center">
                <img src="{{ url_for('static', filename='amity-university-logo.png') }}?_={{ logo_cache_bust }}" alt="Amity University" class="amity-logo" style="max-width: none;">
                <div class="nav-divider"></div>
                <h1 class="nav-title mb-0" id="headerTitle">ORGANIZER LOGIN</h1>
            </div>
        </div>
    </div>

    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                            {% with messages = get_flashed_messages(with_categories=true) %}
                                {% if messages %}
                                    {% for category, message in messages %}
                                        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                                            {{ message }}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                        </div>
                                    {% endfor %}
                                {% endif %}
                            {% endwith %}
                            
                            <div class="text-center mb-3">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-outline-primary user-type-btn active" id="organizerBtn" onclick="selectUserType('organizer')">
                                        <i class="fas fa-calendar-alt me-2"></i>Organizer
                                    </button>
                                    <button type="button" class="btn btn-outline-primary user-type-btn" id="adminBtn" onclick="selectUserType('admin')">
                                        <i class="fas fa-user-shield me-2"></i>Admin
                                    </button>
                                </div>
                            </div>

                            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                                <input type="hidden" name="user_type" id="userType" value="organizer">
                                
                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        <i class="fas fa-user me-2"></i>Username
                                    </label>
                                    <input type="text" class="form-control" id="username" name="username" required 
                                           placeholder="Enter your username">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-2"></i>Password
                                    </label>
                                    <input type="password" class="form-control" id="password" name="password" required 
                                           placeholder="Enter your password">
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-sign-in-alt me-2"></i>LOGIN
                                </button>
                            </form>
                            
                            <div class="text-center mt-3">
                                <small class="text-muted">
                                    Select your role above and enter your credentials
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectUserType(type) {
            // Update UI
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const headerTitle = document.querySelector('.nav-title');
            console.log('Header title element:', headerTitle); // Debug log
            console.log('Selected type:', type); // Debug log
            
            if (type === 'organizer') {
                document.getElementById('organizerBtn').classList.add('active');
                document.getElementById('userType').value = 'organizer';
                if (headerTitle) {
                    headerTitle.textContent = 'ORGANIZER LOGIN';
                }
            } else if (type === 'admin') {
                document.getElementById('adminBtn').classList.add('active');
                document.getElementById('userType').value = 'admin';
                if (headerTitle) {
                    headerTitle.textContent = 'ADMIN LOGIN';
                }
            }
        }

        // Ensure DOM is loaded before any interactions
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded'); // Debug log
        });

        // Form submission enhancement
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = 'Logging in...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
