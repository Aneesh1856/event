<!DOCTYPE html>
<html>
<head>
    <title>QR Code Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .qr-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .qr-image {
            border: 1px solid #ddd;
            padding: 20px;
            background: white;
            margin: 20px 0;
        }
        .class-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Attendance System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('teacher_dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('teacher_logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="qr-container">
            <div class="class-info">
                <h4>{{ subject_name }} ({{ subject_code }})</h4>
                <p>Section {{ class_section }} with {{ teacher_name }}</p>
                <p>Date: {{ current_date }}</p>
                <div class="alert alert-success d-flex align-items-center">
                    <i class="fas fa-broadcast-tower me-2"></i>
                    <strong>Live Session Active</strong>
                    <span class="badge bg-success ms-auto">LIVE</span>
                </div>
            </div>
            
            <h3>Scan QR Code to Mark Attendance</h3>
            <div class="qr-image">
                <img id="qrCode" src="{{ url_for('generate_qr') }}" alt="QR Code" class="img-fluid">
            </div>
            
            <div class="mt-4">
                <button id="endSessionBtn" class="btn btn-danger me-2">End Session</button>
                <button id="refreshBtn" class="btn btn-primary">Refresh QR Code</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('refreshBtn').addEventListener('click', function() {
        const qrImg = document.getElementById('qrCode');
        qrImg.src = "{{ url_for('generate_qr') }}?" + new Date().getTime();
    });

    // End session functionality
    document.getElementById('endSessionBtn').addEventListener('click', function() {
        if (confirm('Are you sure you want to end this session?')) {
            endCurrentSession();
        }
    });

    function endCurrentSession() {
        fetch('/end_class_session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                subject_code: '{{ subject_code }}',
                class_section: '{{ class_section }}'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Session ended successfully!');
                window.close(); // Close the QR window
            } else {
                alert('Failed to end session: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while ending the session');
        });
    }
    
    // Auto-refresh QR code every 25 seconds (before 30s expiration)
    setInterval(function() {
        const qrImg = document.getElementById('qrCode');
        qrImg.src = "{{ url_for('generate_qr') }}?" + new Date().getTime();
    }, 25000);
    
    // Improved auto logout - only logout on actual tab/window close, not navigation
    let isNavigating = false;
    
    // Track navigation
    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'A' || e.target.closest('a')) {
            isNavigating = true;
            setTimeout(() => {
                isNavigating = false;
            }, 1000);
        }
    });
    
    // Auto logout and end session when tab/window is closed
    window.addEventListener('beforeunload', function() {
        // End the session when QR window is closed
        fetch('/end_class_session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                subject_code: '{{ subject_code }}',
                class_section: '{{ class_section }}'
            }),
            keepalive: true
        }).catch(error => {
            console.log('Session cleanup on window close');
        });
        
        // Don't logout if user is navigating
        if (!isNavigating) {
            navigator.sendBeacon('/api/auto_logout', new FormData());
        }
    });
    
    // Handle page unload (when navigating away or closing)
    window.addEventListener('unload', function() {
        // Only logout if not due to navigation
        if (!isNavigating) {
            navigator.sendBeacon('/api/auto_logout', new FormData());
        }
    });
    </script>
</body>
</html>
